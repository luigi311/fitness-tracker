[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-tracker"
version = "5.1.1"
description = "Fitness tracker for logging workings like running and cycling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleaksport>=0.3.0",
    "libpebble2>=0.1.0",
    "cobble-client >= 0.1.0",
    "dbus-fast>=3.0.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.12.0",
    "pydantic-file-settings>=0.1.0",
    "pydantic-settings>=2.14.1",
    "pygobject>=3.56.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.48",
    "workout-parser>=0.2.0",
    "xdg-base-dirs>=6.0.2",
    "alembic>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.0",
    "ty>=0.0.75",
    "vulture>=2.16",
]
flatpak = [
    "flatpak-pip-generator>=26.4.13",
    "req2flatpak>=0.3.1",
    "setuptools>=82.0.1",
]

# Define a console script entry point
[project.scripts]
fitness-tracker = "fitness_tracker.__main__:main"


[tool.ruff]
line-length = 100
indent-width = 4
format.indent-style = "space"
target-version = "py312"
src = ["tests","hooks"]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102", # Flake8-future-annotations
    "B904", # Allow raising exceptions without from e
    "PLR0913", # too many arguments
    "CPY", # Flake8-copyright
    "T201", # Debugging print statements
    "ERA", # Eradicate – detects commented-out code
    "BLE001", # Catch-all exceptions
    "D100", # missing docstring in public module
    "D105", # undocumented magic method
    "D107", # undocumented public init
    "D203", # incorrect-blank-line-before-class
    "D205", # line-between-summary-and-description
    "D212", # multi-line-summary-first-line
    "D407", # missing-dashed-underline-after-section
    "S311", # rand-usage
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN", # Test helpers and assertions do not need production API annotations.
    "D", # Test names and fixture structure are self-documenting.
    "S101", # Assertions are the test contract.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv.sources]
libpebble2 = { git = "https://github.com/luigi311/libpebble2", branch = "modern" }
cobble-client = { git = "https://github.com/luigi311/cobble", branch = "main", subdirectory = "packages/cobble-client" }
bleaksport = { git = "https://github.com/luigi311/bleaksport", branch = "main" }
workout-parser = { git = "https://github.com/luigi311/workout_parser", branch = "main" }
# Pin to rev as there is no new release that fixes packaging
req2flatpak = { git = "https://github.com/johannesjh/req2flatpak", rev = "ad1484bbcd57fcdad88b015d15e6a2d5765b832d" }
