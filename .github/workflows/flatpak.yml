name: Flatpak
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  build-flatpak:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      matrix:
        include:
          - arch: x86_64
            name: amd64
            os: ubuntu-24.04

          - arch: aarch64
            name: aarch64
            os: ubuntu-24.04-arm

      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify lockfile
        run: uv lock --check

      - name: Install deps
        run: uv sync --dev --frozen --group flatpak

      - name: Verify Flatpak source pins
        run: uv run --no-sync python scripts/sync_flatpak_sources.py --check

      - name: Generate flatpak files
        run: ./regenerate_flatpak_deps.sh .
        working-directory: ${{ github.workspace }}

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.luigi311.fitness-tracker.${{ matrix.arch }}.flatpak
          manifest-path: com.luigi311.fitness-tracker.yaml
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Upload flatpak to action
        uses: actions/upload-artifact@v7
        with:
          name: com.luigi311.fitness-tracker.${{ matrix.arch }}.flatpak
          path: com.luigi311.fitness-tracker.${{ matrix.arch }}.flatpak

      - name: Upload flatpak to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: com.luigi311.fitness-tracker.${{ matrix.arch }}.flatpak
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true
